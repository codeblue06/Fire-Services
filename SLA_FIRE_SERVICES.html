<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SLA - FIRE SERVICES</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Montserrat,sans-serif;background:#f4f6f8;padding:15px} .container{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:16px}.logo{text-align:center} input,select,button{width:100%;padding:14px;margin-bottom:12px;border-radius:10px} button{background:#0078d4;color:#fff;font-size:24px;border:none} .row{display:flex;gap:10px;flex-wrap:wrap}.col{flex:1;min-width:180px}</style></head><body><div class="container"><div class="logo"><img src="https://www.usp.ac.fj/wp-content/uploads/2020/07/Full-Colour-2.svg" style="max-width:260px"></div><h1>SLA - FIRE SERVICES</h1><label>Enter FID</label><input id="fid"><label>Enter Name</label><input id="name"><label>Service Report Reference</label><input id="ref"><div class="row"><div class="col"><label>Service Type</label><select id="serviceType"><option value=''>Select</option><option>Monthly Service</option><option>Bi-annual Service</option><option>Annual Service</option><option>Alarm/On-Call</option></select></div><div class="col"><label>Equipment Type</label><select id="equipmentType"><option value=''>Select</option><option>FIP & Fire Detection</option><option>Fire Equipment</option><option>Fire Hydrants</option></select></div><div class="col"><label>L-Code</label><input list='lcodes' id='lcode'><datalist id='lcodes'><option value='L01'><option value='L02'><option value='L03'><option value='L04'><option value='L05'><option value='L06'><option value='L07'><option value='L99'></datalist></div></div><button onclick='sendEmail()'>OK</button><p>After the email opens, use the paperclip icon to attach a photo of the Service Report.</p></div><script>function sendEmail(){let fid=fid=document.getElementById('fid').value.trim();let n=document.getElementById('name').value.trim();let r=document.getElementById('ref').value.trim();let s=document.getElementById('serviceType').value;let e=document.getElementById('equipmentType').value;let l=document.getElementById('lcode').value.trim();if(!fid||!n||!r||!s||!e||!l){alert('Please complete all required fields.');return;}let d=new Date();let dc=String(d.getFullYear()).slice(-2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');let subject=`FID ${fid} ${dc} ${r}`;let body=`FID: ${fid}

Name: ${n}

Service Type: ${s}

Equipment Type: ${e}

Service Report Reference: ${r}

Location Code: ${l}

(Please Attach the Service Report Ensure that the CAUSE, REMEDIAL ACTION & RECOMMENDATIONS ARE CLEARLY STATED)`;location.href=`mailto:estates.services@usp.ac.fj?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;}</script></body></html>
